name: Install kcov
description: >
  Build and install kcov from source. Ubuntu dropped the kcov apt package,
  so this builds it directly on the runner.
runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake binutils-dev libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev

    - name: Build and install kcov
      shell: bash
      run: |
        git clone --depth 1 https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
        cmake -S /tmp/kcov-src -B /tmp/kcov-build
        cmake --build /tmp/kcov-build --parallel "$(nproc)"
        sudo cmake --install /tmp/kcov-build
